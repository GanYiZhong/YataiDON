plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.yataidon.app'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.yataidon.app'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments(
                    "-DANDROID_FFMPEG_PREFIX=${rootProject.file('../.android-ffmpeg').absolutePath}",
                    "-DANDROID_OPENSSL_PREFIX=${rootProject.file('../.android-openssl').absolutePath}",
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_PLATFORM=android-29",
                    "-DNETWORK_URL=${System.getenv('NETWORK_URL') ?: ''}",
                    "-DNETWORK_AUTH_KEY=${System.getenv('NETWORK_AUTH_KEY') ?: ''}"
                )
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Copy shader/es/ from repo root into APK assets as shader/es/
    def shaderSrcDir = rootProject.file('../shader/es')
    def shaderOutDir = layout.buildDirectory.dir('generated/shader_assets/shader/es')

    task copyShaderAssets(type: Copy) {
        from shaderSrcDir
        into shaderOutDir
    }

    def bundleGameData = (findProperty('bundleGameData') ?: 'true').toBoolean()
    def gameDataOutDir = layout.buildDirectory.dir('generated/game_data_assets')

    task copyGameDataAssets(type: Copy) {
        from(rootProject.file('../Skins')) { into 'Skins' }
        from(rootProject.file('../Songs')) { into 'Songs' }
        from(rootProject.file('../config.toml')) {
            filter { String line -> line.replaceFirst(/^(\s*)touch_input(\s*=\s*)false\b/, '$1touch_input$2true') }
        }
        into gameDataOutDir
    }
    copyGameDataAssets.doLast {
        def patched = new File(gameDataOutDir.get().asFile, 'config.toml').text
        if (!(patched =~ /(?m)^\s*touch_input\s*=\s*true\s*$/)) {
            throw new GradleException("config.toml no longer contains an overridable 'touch_input = false' entry; update copyGameDataAssets")
        }
    }

    sourceSets {
        main {
            assets.srcDirs = bundleGameData
                ? ['src/main/assets', layout.buildDirectory.dir('generated/shader_assets').get(), gameDataOutDir.get()]
                : ['src/main/assets', layout.buildDirectory.dir('generated/shader_assets').get()]
        }
    }

    preBuild.dependsOn copyShaderAssets
    if (bundleGameData) preBuild.dependsOn copyGameDataAssets

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            jniDebuggable true
        }
    }
}

dependencies {
    // FileProvider, for handing the downloaded update APK to the system installer.
    implementation 'androidx.core:core:1.13.1'
}
